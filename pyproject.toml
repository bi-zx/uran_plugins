[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uran-plugins-workspace"
version = "0.1.0"
description = "Development test harness for the independently published URAN plugins"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "PyYAML>=6"]

[tool.pytest.ini_options]
testpaths = [
  "protocols/mqtt/tests",
  "network/frpc/tests",
  "motion/cyberdog2/tests",
  "media/tests",
  "sensors/localization/tests",
  "sensors/navigation/tests",
  "tasks/autotask/tests",
  "tests",
]
addopts = "-ra --import-mode=importlib"

[tool.hatch.build.targets.wheel]
packages = []
