name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Releases set this to the locked internal wheelhouse. With no override,
      # test.sh resolves the published SDK/interface wheels from the package
      # index; it never assumes a sibling source checkout.
      URAN_DEPENDENCY_WHEELHOUSE: ${{ vars.URAN_DEPENDENCY_WHEELHOUSE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest build hatchling setuptools
      - run: ./scripts/test.sh
