[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uran-so101-plugin"
version = "0.1.0"
description = "URAN SO101/Feetech arm worker with LeRobot-compatible IK"
requires-python = ">=3.6"
dependencies = ["uran-worker-sdk>=1,<2", "uran-interfaces>=1,<2", "PyYAML>=5"]

[project.optional-dependencies]
test = ["pytest>=7"]
serial = ["pyserial>=3.5"]

[project.scripts]
uran-so101-worker = "uran_so101_plugin.worker:main"
uran-so101-calibrate = "uran_so101_plugin.calibrate:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
