[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uran-cyberdog2-plugin"
version = "0.1.0"
description = "URAN CyberDog2 motion policy with simulation and ROS2 vendor backends"
requires-python = ">=3.6"
dependencies = ["uran-worker-sdk>=1,<2", "uran-interfaces>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
uran-cyberdog2-worker = "uran_cyberdog2_plugin.worker:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
