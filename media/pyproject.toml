[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uran-media-plugin"
version = "0.1.0"
description = "URAN WebRTC, RTSP and camera backends"
requires-python = ">=3.6"
dependencies = ["uran-worker-sdk>=1,<2", "uran-interfaces>=1,<2"]

[project.optional-dependencies]
webrtc = ["aiortc>=1.7", "av>=11", "numpy>=1.23"]
test = ["pytest>=7"]

[project.scripts]
uran-media-worker = "uran_media_plugin.worker:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
